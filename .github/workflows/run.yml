name: V2Ray Collector & Tester Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'  # اجرای خودکار هر ۲ ساعت یک‌بار
  workflow_dispatch:        # امکان اجرای دستی از تب Actions

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Download & Setup Xray Core
        run: |
          mkdir -p .xray_bin
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d .xray_bin
          chmod +x .xray_bin/xray

      - name: Run Collector & Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python process_configs_v2.py
