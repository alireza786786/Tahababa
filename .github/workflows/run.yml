name: Process large config lists and send to Telegram (v2)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: xray-processor-group
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Xray Binary
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: ./.xray_bin
          key: ${{ runner.os }}-xray-bin-v1

      - name: Download Xray Binary
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.xray_bin
          curl -L -o ./.xray_bin/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o ./.xray_bin/xray.zip -d ./.xray_bin/
          chmod +x ./.xray_bin/xray

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      - name: Run processor (v2)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python process_configs_v2.py \
            --url "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt" \
            --channel-name "@Goodbaye_filtering" \
            --concurrency 20 \
            --max-latency-ms 250 \
            --zip --output-dir outputs

      # آپلود و ثبت تغییرات فایل‌های سابسکرایب روی ریپازیتوری
      - name: Commit & Push updated subscriptions
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p subs
          cp outputs/subscription_part*.txt subs/
          git add subs/
          git commit -m "Auto-update subscription links [skip ci]" || exit 0
          git push
