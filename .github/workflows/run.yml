name: Ultimate V2Ray Config Collector & Speed Tester

on:
  schedule:
    # اجرای خودکار هر ۲ ساعت یک‌بار (در دقیقه ۱۷ برای جلویگیری از تاخیر گیت‌هاب)
    - cron: '17 */2 * * *'
  workflow_dispatch: # امکان اجرای دستی از تب Actions در گیت‌هاب

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کدها از ریپوزیتوری
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. راه‌اندازی پایتون نسخه 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ۳. دانلود، استخراج و اعطای دسترسی اجرایی به هسته Xray
      - name: Install Xray Core
        run: |
          mkdir -p .xray_bin
          XRAY_URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | grep "browser_download_url.*Xray-linux-64.zip" | cut -d '"' -f 4)
          curl -L -o xray.zip $XRAY_URL
          unzip -o xray.zip -d .xray_bin
          chmod +x .xray_bin/xray
          echo "Xray-core successfully prepared at .xray_bin/xray"

      # ۴. نصب کتابخانه‌های پیش‌نیاز پایتون
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      # ۵. اجرای اسکریپت اصلی پردازش و تست واقعی کانفیگ‌ها
      - name: Run Ultimate V2Ray Collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python process_configs_v2.py --concurrency 15 --max-latency-ms 600 --output-dir outputs

      # ۶. ذخیره خودکار فایل‌های خروجی و ثبت Commit در گیت‌هاب
      - name: Commit and Push Updated Subscriptions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add outputs/ history.db
          
          # بررسی اینکه آیا تغییری در خروجی ایجاد شده است یا خیر
          if git diff --staged --quiet; then
            echo "No updates or new configs to commit."
          else
            git commit -m "⚡️ Auto-update subscriptions [Hybrid Real Speed Tested]"
            git push
          fi
